<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fidelis Nail Parlour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Outfit',sans-serif;background:#fff;color:#212121}
body{overflow-x:hidden}
img,video{max-width:100%;display:block}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit;font-size:inherit}
ul,ol{list-style:none}
a{color:inherit;text-decoration:none}
table{border-collapse:collapse;width:100%}
input,select,textarea{font-family:inherit;font-size:inherit;outline:none}
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.6}
:root{
  --p50:#FFF8F3;--p100:#FFEEE0;--p200:#FFDAB9;--p300:#FFC799;
  --p400:#FFB07A;--p500:#FF995C;--p600:#E67D3D;--p700:#CC6020;
  --black:#000;--white:#fff;
  --g50:#FAFAFA;--g100:#F5F5F5;--g200:#EEEEEE;--g300:#E0E0E0;
  --g400:#BDBDBD;--g500:#9E9E9E;--g600:#757575;--g700:#616161;
  --g800:#424242;--g900:#212121;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow:0 2px 15px -3px rgba(0,0,0,.07),0 10px 20px -2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 40px -15px rgba(0,0,0,.10);
  --shadow-xl:0 25px 50px -12px rgba(0,0,0,.15);
  --radius-sm:8px;--radius:12px;--radius-lg:16px;--radius-xl:20px;--radius-2xl:24px;--radius-full:9999px;
}
/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fade-in{animation:fadeIn .3s ease-out}
.slide-in{animation:slideIn .3s ease-out}
/* Masonry */
.masonry{column-count:3;column-gap:1rem}
.masonry-item{break-inside:avoid;margin-bottom:1rem}
@media(max-width:1024px){.masonry{column-count:2}}
@media(max-width:640px){.masonry{column-count:1}}
/* Scrollbar */
.scroll-thin::-webkit-scrollbar{width:5px}
.scroll-thin::-webkit-scrollbar-track{background:#f1f1f1;border-radius:4px}
.scroll-thin::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}
/* Spinner */
.spinner{width:24px;height:24px;border:3px solid var(--p200);border-top-color:var(--p500);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
/* Responsive helpers */
@media(min-width:768px){.md-flex{display:flex!important}.md-hidden{display:none!important}.md-block{display:block!important}.md-grid-2{grid-template-columns:repeat(2,1fr)!important}.md-grid-3{grid-template-columns:repeat(3,1fr)!important}.md-grid-4{grid-template-columns:repeat(4,1fr)!important}.md-ml-64{margin-left:16rem!important}.md-ml-20{margin-left:5rem!important}.md-pb-0{padding-bottom:0!important}}
@media(max-width:767px){.hide-mobile{display:none!important}}
</style>
</head>
<body>
<div id="app" style="min-height:100vh"></div>

<script src="config.js"></script>

<script>
'use strict';

/* =====================================================================
/* =====================================================================
   CONFIG - loaded from window.FIDELIS_CONFIG (set by config.js)
   config.js is gitignored and never committed. See .env.example.
   ===================================================================== */
var _cfg       = (window.FIDELIS_CONFIG) || {};
var SUPA_URL   = _cfg.SUPABASE_URL  || '';
var SUPA_KEY   = _cfg.SUPABASE_KEY  || '';
var ADMIN_EMAIL= _cfg.ADMIN_EMAIL   || '';
var ADMIN_PASS = _cfg.ADMIN_PASSWORD|| '';
var ADMIN_HASH = _cfg.ADMIN_HASH    || '';
var ADMIN_SALT = _cfg.ADMIN_SALT    || '';
var db = null;
try {
  if (SUPA_URL && SUPA_KEY) db = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  else console.warn('Supabase not configured. Check config.js');
} catch(e) { console.warn('Supabase init failed:', e); }

/* =====================================================================
   APP STATE
   ===================================================================== */
var view        = 'public';   // 'public' | 'admin'
var page        = 'home';     // public page
var adminPage   = 'dashboard';
var loggedIn    = false;
var adminName   = 'Admin';
var adminRole   = 'Manager';
var sidebarOpen = true;
var mobileMenu  = false;
var loginErr    = '';
var loginLoading= false;
var galleryFilter = 'all';
var showModal   = false;
var modalType   = '';
var modalData   = null;
var bookingForm = { name:'', phone:'', service:'', date:'', time:'' };

/* data arrays - populated from Supabase */
var services    = [];
var bookings    = [];
var staff       = [];
var inventory   = [];
var gallery     = [];

/* id counters for offline fallback */
var nextSvcId=1,nextBkId=1,nextStId=1,nextInvId=1,nextGalId=1;

var STATUS_COLORS = {
  pending:     'background:#FEF9C3;color:#854D0E',
  deposit_paid:'background:#DBEAFE;color:#1D4ED8',
  approved:    'background:#DCFCE7;color:#15803D',
  completed:   'background:#D1FAE5;color:#047857',
  cancelled:   'background:#F3F4F6;color:#374151',
  no_show:     'background:#FEE2E2;color:#991B1B'
};
var STATUS_LABELS = {
  pending:'Pending', deposit_paid:'Deposit Paid', approved:'Approved',
  completed:'Completed', cancelled:'Cancelled', no_show:'No Show'
};

var config = {
  salon_name: 'Fidelis Nail Parlour',
  tagline: 'Where Beauty Meets Elegance',
  phone: '+254 700 000 000',
  email: 'hello@fidelisnails.com',
  location: 'Nairobi, Kenya'
};

/* =====================================================================
   HELPERS
   ===================================================================== */
function kes(n) { return 'KES ' + (Number(n)||0).toLocaleString(); }
function initials(name) {
  if (!name) return '?';
  return name.split(' ').map(function(w){ return w[0]||''; }).join('').toUpperCase().slice(0,2);
}
function el(id) { return document.getElementById(id); }
function svgIcon(path, cls) {
  return '<svg class="'+cls+'" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>';
}

/* =====================================================================
   RENDER ENGINE
   ===================================================================== */
function render() {
  var app = el('app');
  if (!app) return;
  try {
    if (view === 'public') {
      app.innerHTML = renderPublic();
    } else if (!loggedIn) {
      app.innerHTML = renderLogin();
    } else {
      app.innerHTML = renderAdmin();
    }
    bindEvents();
  } catch(e) {
    console.error('Render error:', e);
    app.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;">'
      + '<h2 style="color:#e53e3e;margin-bottom:8px;">Something went wrong</h2>'
      + '<p style="color:#666;margin-bottom:16px;">' + (e.message||String(e)) + '</p>'
      + '<button onclick="loggedIn=false;view=\'public\';render()" style="padding:10px 20px;background:#000;color:#fff;border:none;border-radius:8px;cursor:pointer;">Reset</button>'
      + '</div>';
  }
}

/* =====================================================================
   PUBLIC SITE
   ===================================================================== */
function renderPublic() {
  var content = '';
  if (page === 'home')     content = renderHome();
  if (page === 'services') content = renderServices();
  if (page === 'booking')  content = renderBooking();
  if (page === 'gallery')  content = renderGalleryPage();
  return renderHeader() + '<main>' + content + '</main>' + renderFooter() + (showModal ? renderModal() : '');
}

function renderHeader() {
  var links = [
    {id:'home',label:'Home'},{id:'services',label:'Services'},
    {id:'gallery',label:'Gallery'}
  ];
  var desktopLinks = links.map(function(l){
    var active = page===l.id ? 'color:#000;font-weight:600;' : 'color:var(--g500);';
    return '<button onclick="go(\''+l.id+'\')" style="font-size:.875rem;font-weight:500;'+active+'background:none;border:none;cursor:pointer;transition:color .15s">'+l.label+'</button>';
  }).join('');

  var mobileLinksHtml = '';
  if (mobileMenu) {
    mobileLinksHtml = '<div style="border-top:1px solid var(--g200);padding:12px 16px;display:flex;flex-direction:column;gap:4px;" class="fade-in">'
      + links.map(function(l){
          var bg = page===l.id ? 'background:var(--p100);color:#000;' : 'color:var(--g700);';
          return '<button onclick="go(\''+l.id+'\')" style="text-align:left;padding:12px 16px;border-radius:var(--radius);font-weight:500;'+bg+'background:none;border:none;cursor:pointer;transition:.15s">'+l.label+'</button>';
        }).join('')
      + '<button onclick="go(\'booking\')" style="margin-top:4px;padding:12px 16px;background:#000;color:#fff;border-radius:var(--radius);font-weight:500;border:none;cursor:pointer;">Book Appointment</button>'
      + '<button onclick="goAdmin()" style="margin-top:4px;padding:10px;font-size:.75rem;color:var(--g500);background:none;border:none;cursor:pointer;">Admin Access</button>'
      + '</div>';
  }

  return '<header style="position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--g200);">'
    + '<nav style="max-width:80rem;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;">'
    + '<button onclick="go(\'home\')" style="display:flex;align-items:center;gap:10px;background:none;border:none;cursor:pointer;">'
    +   '<div style="width:40px;height:40px;background:linear-gradient(135deg,var(--p200),var(--p300));border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);">'
    +     svgIcon('<path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>','')
    +   '</div>'
    +   '<span style="font-family:\'Playfair Display\',serif;font-size:1.125rem;font-weight:600;">'+config.salon_name+'</span>'
    + '</button>'
    + '<div class="hide-mobile" style="display:flex;align-items:center;gap:32px;">'
    + desktopLinks
    + '<button onclick="go(\'booking\')" style="background:#000;color:#fff;padding:10px 20px;border-radius:var(--radius-full);font-size:.875rem;font-weight:500;border:none;cursor:pointer;box-shadow:var(--shadow-sm);">Book Now</button>'
    + '<button onclick="goAdmin()" style="font-size:.75rem;color:var(--g400);background:none;border:none;cursor:pointer;">[lock] Admin</button>'
    + '</div>'
    + '<button id="menuBtn" class="md-hidden" style="padding:8px;border-radius:var(--radius-sm);background:none;border:none;cursor:pointer;">'
    +   svgIcon(mobileMenu ? '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' : '<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>','')
    + '</button>'
    + '</nav>'
    + mobileLinksHtml
    + '</header>';
}

function renderFooter() {
  return '<footer style="background:#000;color:#fff;padding:48px 24px 24px;">'
    + '<div style="max-width:80rem;margin:0 auto;">'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px;margin-bottom:32px;">'
    + '<div>'
    + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">'
    + '<div style="width:36px;height:36px;background:linear-gradient(135deg,var(--p200),var(--p300));border-radius:50%;display:flex;align-items:center;justify-content:center;">'
    + svgIcon('<path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>','')
    + '</div>'
    + '<span style="font-family:\'Playfair Display\',serif;font-size:1.1rem;font-weight:600;">'+config.salon_name+'</span>'
    + '</div>'
    + '<p style="color:var(--g400);font-size:.875rem;">Premium nail care for the modern woman.</p>'
    + '</div>'
    + '<div>'
    + '<h4 style="font-weight:600;margin-bottom:12px;">Quick Links</h4>'
    + '<div style="display:flex;flex-direction:column;gap:8px;">'
    + ['home','services','gallery','booking'].map(function(p){
        return '<button onclick="go(\''+p+'\')" style="color:var(--g400);font-size:.875rem;text-align:left;background:none;border:none;cursor:pointer;transition:color .15s;width:fit-content;">'
          + p.charAt(0).toUpperCase()+p.slice(1)
          + '</button>';
      }).join('')
    + '</div>'
    + '</div>'
    + '<div>'
    + '<h4 style="font-weight:600;margin-bottom:12px;">Contact</h4>'
    + '<div style="display:flex;flex-direction:column;gap:8px;color:var(--g400);font-size:.875rem;">'
    + '<span>'+config.phone+'</span><span>'+config.email+'</span><span>'+config.location+'</span>'
    + '</div>'
    + '</div>'
    + '</div>'
    + '<div style="border-top:1px solid var(--g800);padding-top:24px;text-align:center;color:var(--g500);font-size:.8rem;">'
    + '(c) '+new Date().getFullYear()+' '+config.salon_name+'. All rights reserved.'
    + '</div>'
    + '</div>'
    + '</footer>';
}

/* --- HOME PAGE --- */
function renderHome() {
  var svcCards = services.slice(0,8).map(function(s,i){
    return '<div class="fade-in" style="background:#fff;border-radius:var(--radius-xl);padding:24px;box-shadow:var(--shadow);border:1px solid var(--g100);transition:box-shadow .2s;" onmouseover="this.style.boxShadow=\'var(--shadow-lg)\'" onmouseout="this.style.boxShadow=\'var(--shadow)\'">'
      + '<div style="width:48px;height:48px;background:linear-gradient(135deg,var(--p100),var(--p200));border-radius:var(--radius);display:flex;align-items:center;justify-content:center;margin-bottom:16px;">'
      + svgIcon('<path d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>','')
      + '</div>'
      + '<h3 style="font-weight:600;font-size:1rem;margin-bottom:4px;">'+s.name+'</h3>'
      + '<p style="font-size:.8rem;color:var(--g500);margin-bottom:12px;">'+s.duration+'</p>'
      + '<div style="display:flex;align-items:center;justify-content:space-between;">'
      + '<span style="font-weight:700;color:var(--p600);">'+kes(s.price)+'</span>'
      + '<button onclick="bookNow('+s.id+')" style="padding:6px 14px;background:#000;color:#fff;border-radius:var(--radius-full);font-size:.8rem;font-weight:500;border:none;cursor:pointer;">Book</button>'
      + '</div>'
      + '</div>';
  }).join('');

  var galPrev = gallery.slice(0,8).map(function(g){
    var img = g.fileData
      ? (g.type==='video'
          ? '<video src="'+g.fileData+'" style="width:100%;height:100%;object-fit:cover;"></video>'
          : '<img src="'+g.fileData+'" alt="'+g.fileName+'" style="width:100%;height:100%;object-fit:cover;" loading="lazy">')
      : '<div style="width:100%;height:100%;background:linear-gradient(135deg,var(--p100),var(--p300));"></div>';
    return '<div style="aspect-ratio:1;border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;" onclick="openGalleryItem('+g.id+')">'
      + img + '</div>';
  }).join('');

  return '<section style="background:linear-gradient(135deg,var(--p50),#fff,var(--p100));padding:80px 24px;position:relative;overflow:hidden;">'
    + '<div style="position:absolute;top:-60px;right:-60px;width:300px;height:300px;background:radial-gradient(circle,var(--p200),transparent);opacity:.4;pointer-events:none;"></div>'
    + '<div style="position:absolute;bottom:-60px;left:-60px;width:280px;height:280px;background:radial-gradient(circle,var(--p300),transparent);opacity:.25;pointer-events:none;"></div>'
    + '<div style="max-width:48rem;margin:0 auto;text-align:center;position:relative;">'
    + '<div style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.8);padding:6px 16px;border-radius:var(--radius-full);box-shadow:var(--shadow-sm);margin-bottom:24px;">'
    + '<span style="width:8px;height:8px;background:#4ADE80;border-radius:50%;animation:pulse 2s infinite;display:inline-block;"></span>'
    + '<span style="font-size:.875rem;color:var(--g600);">Now accepting appointments</span>'
    + '</div>'
    + '<h1 style="font-family:\'Playfair Display\',serif;font-size:clamp(2.5rem,6vw,4.5rem);font-weight:600;margin-bottom:16px;line-height:1.1;">'+config.salon_name+'</h1>'
    + '<p style="font-size:1.125rem;color:var(--g500);margin-bottom:36px;">'+config.tagline+'</p>'
    + '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">'
    + '<button onclick="go(\'booking\')" style="padding:14px 32px;background:#000;color:#fff;border-radius:var(--radius-full);font-weight:500;border:none;cursor:pointer;box-shadow:var(--shadow);font-size:.95rem;">Book Appointment</button>'
    + '<button onclick="go(\'services\')" style="padding:14px 32px;background:#fff;color:#000;border-radius:var(--radius-full);font-weight:500;border:1px solid var(--g200);cursor:pointer;box-shadow:var(--shadow-sm);font-size:.95rem;">View Services</button>'
    + '</div>'
    + '</div>'
    + '</section>'

    + '<section style="padding:80px 24px;background:#fff;">'
    + '<div style="max-width:80rem;margin:0 auto;">'
    + '<div style="text-align:center;margin-bottom:48px;">'
    + '<span style="color:var(--p500);font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;">Our Services</span>'
    + '<h2 style="font-family:\'Playfair Display\',serif;font-size:2rem;font-weight:600;margin-top:8px;">Treatments We Offer</h2>'
    + '</div>'
    + (services.length ? '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;">'+svcCards+'</div>' : '<p style="text-align:center;color:var(--g400);">No services listed yet.</p>')
    + '<div style="text-align:center;margin-top:32px;">'
    + '<button onclick="go(\'services\')" style="background:none;border:none;cursor:pointer;color:#000;font-weight:500;font-size:.95rem;">View All Services &rarr;</button>'
    + '</div>'
    + '</div>'
    + '</section>'

    + '<section style="padding:80px 24px;background:var(--g50);">'
    + '<div style="max-width:80rem;margin:0 auto;">'
    + '<div style="text-align:center;margin-bottom:48px;">'
    + '<span style="color:var(--p500);font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;">Our Work</span>'
    + '<h2 style="font-family:\'Playfair Display\',serif;font-size:2rem;font-weight:600;margin-top:8px;">Nail Art Gallery</h2>'
    + '</div>'
    + (gallery.length ? '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;">'+galPrev+'</div>' : '<p style="text-align:center;color:var(--g400);">No gallery items yet.</p>')
    + '<div style="text-align:center;margin-top:32px;">'
    + '<button onclick="go(\'gallery\')" style="background:none;border:none;cursor:pointer;color:#000;font-weight:500;font-size:.95rem;">View Full Gallery &rarr;</button>'
    + '</div>'
    + '</div>'
    + '</section>'

    + '<section style="padding:80px 24px;background:#000;color:#fff;">'
    + '<div style="max-width:80rem;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:48px;align-items:center;">'
    + '<div>'
    + '<span style="color:var(--p300);font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;">Get In Touch</span>'
    + '<h2 style="font-family:\'Playfair Display\',serif;font-size:2rem;font-weight:600;margin:12px 0 16px;">Visit Us Today</h2>'
    + '<p style="color:var(--g400);margin-bottom:24px;line-height:1.7;">Experience the ultimate nail care at Fidelis. Our skilled technicians are ready to give you the perfect nails you deserve.</p>'
    + '<button onclick="go(\'booking\')" style="padding:14px 28px;background:var(--p200);color:#000;border-radius:var(--radius-full);font-weight:500;border:none;cursor:pointer;">Book Your Appointment</button>'
    + '</div>'
    + '<div style="display:flex;flex-direction:column;gap:16px;">'
    + contactCard('[phone]', 'Phone', config.phone)
    + contactCard('[mail]',  'Email', config.email)
    + contactCard('[pin]',   'Location', config.location)
    + '</div>'
    + '</div>'
    + '</section>';
}

function contactCard(icon, label, value) {
  return '<div style="display:flex;align-items:center;gap:16px;padding:20px;background:rgba(255,255,255,.05);border-radius:var(--radius-xl);">'
    + '<div style="width:44px;height:44px;background:rgba(255,218,185,.15);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--p300);">'+icon+'</div>'
    + '<div><p style="font-size:.8rem;color:var(--g400);margin-bottom:2px;">'+label+'</p><p style="color:#fff;font-size:.95rem;">'+value+'</p></div>'
    + '</div>';
}

/* --- SERVICES PAGE --- */
function renderServices() {
  var cards = services.map(function(s){
    return '<div style="background:#fff;border-radius:var(--radius-xl);padding:24px;box-shadow:var(--shadow);border:1px solid var(--g100);display:flex;flex-direction:column;gap:12px;" class="fade-in">'
      + '<div style="display:flex;align-items:flex-start;justify-content:space-between;">'
      + '<div style="width:48px;height:48px;background:linear-gradient(135deg,var(--p100),var(--p200));border-radius:var(--radius);display:flex;align-items:center;justify-content:center;">'
      + svgIcon('<path d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>','')
      + '</div>'
      + '<span style="padding:4px 10px;background:var(--p50);color:var(--p600);border-radius:var(--radius-full);font-size:.75rem;font-weight:600;">'+s.category+'</span>'
      + '</div>'

    + '<select id="bk-service" onchange="updateBk(\'service\',this.value);render()" style="width:100%;padding:11px 14px;border:1.5px solid var(--g300);border-radius:var(--radius);font-size:.95rem;background:#fff;cursor:pointer;">'+svcOptions+'</select>'

function row(label, val) {
  return '<div style="display:flex;justify-content:space-between;padding:4px 0;">'
    + '<span style="color:var(--g600);">'+label+'</span>'
    + '<span style="font-weight:500;">'+val+'</span>'

}
function formField(type, id, label, value, placeholder, onInput) {
  return '<div>'
    + '<label style="display:block;font-size:.8rem;font-weight:600;color:var(--g700);margin-bottom:6px;">'+label+'</label>'
    + '<input type="'+type+'" id="'+id+'" value="'+value+'" placeholder="'+placeholder+'" oninput="'+onInput+'"'
    + ' style="width:100%;padding:11px 14px;border:1.5px solid var(--g300);border-radius:var(--radius);font-size:.95rem;transition:border-color .15s;"'
    + ' onfocus="this.style.borderColor=\'var(--p400)\'" onblur="this.style.borderColor=\'var(--g300)\'">'

}

/* --- GALLERY PAGE --- */
function renderGalleryPage() {
  var cats = ['all','gel','extensions','art','care','polish','removal','combo'];
  var tabs = cats.map(function(c){
    var active = galleryFilter===c;
    return '<button onclick="setFilter(\''+c+'\')" style="padding:8px 18px;border-radius:var(--radius-full);font-size:.875rem;font-weight:500;cursor:pointer;border:1px solid var(--g200);'
      + (active ? 'background:#000;color:#fff;border-color:#000;' : 'background:#fff;color:var(--g600);')
      + '">'+(c.charAt(0).toUpperCase()+c.slice(1))+'</button>';
  }).join('');

  var filtered = galleryFilter==='all' ? gallery : gallery.filter(function(g){ return g.service===galleryFilter; });
  var items = filtered.map(function(g){
    var inner = g.fileData
      ? (g.type==='video'
          ? '<video src="'+g.fileData+'" style="width:100%;height:100%;object-fit:cover;"></video>'
          : '<img src="'+g.fileData+'" alt="'+g.fileName+'" style="width:100%;height:100%;object-fit:cover;" loading="lazy">')
      : '<div style="width:100%;height:100%;background:linear-gradient(135deg,var(--p100),var(--p300));"></div>';
    return '<div class="masonry-item" style="border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;box-shadow:var(--shadow-sm);" onclick="openGalleryItem('+g.id+')">'
      + '<div style="position:relative;">'
      + inner
      + '<div style="position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.5);color:#fff;font-size:.7rem;padding:3px 8px;border-radius:var(--radius-full);">'+g.service+'</div>'
      + '</div>'
      + '</div>';
  }).join('');

  return '<section style="padding:64px 24px;background:linear-gradient(to bottom,var(--p50),#fff);min-height:60vh;">'
    + '<div style="max-width:80rem;margin:0 auto;">'
    + '<div style="text-align:center;margin-bottom:40px;">'
    + '<span style="color:var(--p500);font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;">Portfolio</span>'
    + '<h1 style="font-family:\'Playfair Display\',serif;font-size:2.5rem;font-weight:600;margin-top:8px;">Nail Art Gallery</h1>'
    + '</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:36px;">'+tabs+'</div>'
    + (filtered.length ? '<div class="masonry">'+items+'</div>' : '<p style="text-align:center;color:var(--g400);padding:48px;">No items in this category.</p>')
    + '</div></section>';
}

  if (adminPage==='services')   return renderServicesMgmt();
  if (adminPage==='gallery')    return renderGalleryMgmt();
  if (adminPage==='inventory')  return renderInventoryMgmt();
  if (adminPage==='analytics')  return renderAnalytics();
  return '';
}

  ].map(function(s){
    return '<div style="background:#fff;border-radius:var(--radius-xl);padding:24px;box-shadow:var(--shadow);border:1px solid var(--g100);">'

      + '<td style="padding:14px 16px;color:var(--g500);font-size:.875rem;">'+(b.service||'-')+'</td>'
      + '<td style="padding:14px 16px;color:var(--g500);font-size:.875rem;">'+(b.date||'-')+'</td>'

function renderBookingsMgmt() {
  var rows = bookings.map(function(b){
    var sc  = STATUS_COLORS[b.status||'pending'] || 'background:var(--g100);color:var(--g700)';
    var actions = '';
    if (b.status==='pending') {
      actions = '<button onclick="updateStatus('+b.id+',\'approved\')" style="'+actionBtn('#DCFCE7','#15803D')+'">Approve</button>'
              + '<button onclick="updateStatus('+b.id+',\'cancelled\')" style="'+actionBtn('#FEE2E2','#991B1B')+'">Reject</button>';
    } else if (b.status==='approved') {
      actions = '<button onclick="updateStatus('+b.id+',\'completed\')" style="'+actionBtn('#D1FAE5','#047857')+'">Complete</button>'
              + '<button onclick="updateStatus('+b.id+',\'no_show\')" style="'+actionBtn('#FEE2E2','#991B1B')+'">No Show</button>';
    } else if (b.status==='deposit_paid') {
      actions = '<button onclick="updateStatus('+b.id+',\'approved\')" style="'+actionBtn('#DCFCE7','#15803D')+'">Approve</button>';
    } else {
      actions = '<span style="font-size:.75rem;color:var(--g400);">-</span>';
    }
    return '<tr style="border-bottom:1px solid var(--g100);font-size:.875rem;">'
      + '<td style="padding:14px 16px;font-weight:500;">'+(b.client||'-')+'</td>'
      + '<td style="padding:14px 16px;color:var(--g500);">'+(b.phone||'-')+'</td>'
      + '<td style="padding:14px 16px;color:var(--g500);">'+(b.service||'-')+'</td>'
      + '<td style="padding:14px 16px;font-weight:500;">'+kes(b.fullPrice)+'</td>'
      + '<td style="padding:14px 16px;color:#15803D;">'+kes(b.depositPaid)+'</td>'
      + '<td style="padding:14px 16px;">'+(b.date||'-')+' '+(b.time||'')+'</td>'
      + '<td style="padding:14px 16px;"><span style="padding:4px 10px;border-radius:var(--radius-full);font-size:.75rem;font-weight:600;'+sc+'">'+(STATUS_LABELS[b.status]||'-')+'</span></td>'
      + '<td style="padding:14px 16px;"><div style="display:flex;gap:6px;">'+actions+'</div></td>'
      + '</tr>';
  }).join('');

  return '<div class="fade-in" style="padding-bottom:80px;" class="md-pb-0">'
    + pageHeader('Bookings Management','Manage all client appointments')
    + '<div style="background:#fff;border-radius:var(--radius-xl);box-shadow:var(--shadow);border:1px solid var(--g100);overflow:hidden;">'
    + '<div style="overflow-x:auto;">'
    + '<table><thead style="background:var(--g50);"><tr>'
    + ['Client','Phone','Service','Full Price','Deposit','Date & Time','Status','Actions'].map(function(h){ return '<th style="padding:12px 16px;text-align:left;font-size:.8rem;color:var(--g500);font-weight:600;white-space:nowrap;">'+h+'</th>'; }).join('')
    + '</tr></thead><tbody>'+(rows||'<tr><td colspan="8" style="padding:32px;text-align:center;color:var(--g400);">No bookings yet.</td></tr>')+'</tbody></table>'
    + '</div></div></div>';
}

function renderAnalytics() {
  var completed = bookings.filter(function(b){ return b.status==='completed'; }).length;
  var total     = bookings.length;
  var rate      = total>0 ? Math.round((completed/total)*100) : 0;
  var revenue   = bookings.filter(function(b){ return b.status==='completed'; }).reduce(function(s,b){ return s+(b.fullPrice||0); },0);

  var stats = [
    {label:'Total Bookings',    val:total},
    {label:'Completion Rate',   val:rate+'%'},
    {label:'Total Revenue',     val:kes(revenue)},
    {label:'Active Services',   val:services.length},
    {label:'Staff Members',     val:staff.length},
    {label:'Gallery Items',     val:gallery.length}
  ].map(function(s){
    return '<div style="background:#fff;border-radius:var(--radius-xl);padding:24px;box-shadow:var(--shadow);border:1px solid var(--g100);text-align:center;">'
      + '<p style="font-size:.8rem;color:var(--g400);margin-bottom:8px;">'+s.label+'</p>'
      + '<p style="font-size:2rem;font-weight:700;color:#000;">'+s.val+'</p>'
      + '</div>';
  }).join('');

  return '<div class="fade-in" style="padding-bottom:80px;" class="md-pb-0">'
    + pageHeader('Analytics','Business insights and metrics')
    + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-top:24px;">'+stats+'</div>'
    + '</div>';
}

function pageHeader(title, subtitle) {
  return '<div>'
    + '<h2 style="font-size:1.375rem;font-weight:600;color:#000;">'+title+'</h2>'
    + '<p style="color:var(--g400);font-size:.875rem;margin-top:2px;">'+subtitle+'</p>'
    + '</div>';
}
function addBtn(bg, color) {
  bg    = bg    || '#000';
  color = color || '#fff';
  return 'padding:10px 18px;background:'+bg+';color:'+color+';border-radius:var(--radius);font-size:.875rem;font-weight:500;border:none;cursor:pointer;box-shadow:var(--shadow-sm);';
}

/* =====================================================================
   LOGIN
   ===================================================================== */
function doLogin_attempt() {
  var emailEl = el('login-email');
  var passEl  = el('login-password');
  if (!emailEl || !passEl) { loginErr='Form error - please reload'; render(); return; }

  var email = emailEl.value.trim().toLowerCase();
  var pass  = passEl.value;

  if (!email || !pass) { loginErr='Please enter your email and password'; render(); return; }

  loginErr = ''; loginLoading = true; render();

  /* SHA-256 via SubtleCrypto */
  /* Check 1: direct password match from config.js */
  if (ADMIN_EMAIL && email === ADMIN_EMAIL && ADMIN_PASS && pass === ADMIN_PASS) {
    finishLogin('Admin', 'Manager');
    if (db) db.auth.signInWithPassword({ email: email, password: pass }).catch(function(){});
    return;
  }

  /* Check 2: SHA-256 hash match (fallback if ADMIN_PASS not set) */
  if (ADMIN_EMAIL && ADMIN_HASH && ADMIN_SALT && crypto && crypto.subtle) {
    var enc  = new TextEncoder();
    crypto.subtle.digest('SHA-256', enc.encode(pass + ADMIN_SALT)).then(function(buf) {
      var hex = Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      if (email === ADMIN_EMAIL && hex === ADMIN_HASH) {
        finishLogin('Admin', 'Manager');
        if (db) db.auth.signInWithPassword({ email: email, password: pass }).catch(function(){});
        return;
      }
      trySupabase(email, pass);
    }).catch(function(){ trySupabase(email, pass); });
    return;
  }

  /* Check 3: Supabase auth */
  trySupabase(email, pass);
}

function trySupabase(email, pass) {
  if (!db) {
    loginLoading = false;
    loginErr = 'Incorrect email or password';
    render(); return;
  }
  db.auth.signInWithPassword({ email: email, password: pass }).then(function(result) {
    if (result.error) {
      loginLoading = false;
      var msg = result.error.message || 'Incorrect email or password';
      if (msg.toLowerCase().indexOf('confirm') !== -1) {
        msg = 'Email not confirmed. In Supabase: Authentication -> Providers -> Email -> disable Confirm email.';
      }
      loginErr = msg; render();
    } else if (result.data && result.data.user) {
      finishLogin(result.data.user.email.split('@')[0] || 'Admin', 'Manager');
    } else {
      loginLoading = false; loginErr = 'Login failed. Check your credentials.'; render();
    }
  }).catch(function(err) {
    loginLoading = false;
    loginErr = 'Connection error: ' + (err.message || 'Try again');
    render();
  });
}

function finishLogin(name, role) {
  loggedIn = true; view = 'admin';
  adminName = name; adminRole = role;
  loginErr = ''; loginLoading = false;
  render();
  if (db) loadAll();
}

/* =====================================================================
   SUPABASE DATA LAYER
   ===================================================================== */
function loadAll() {
  if (!db) return;
  Promise.all([
    db.from('services').select('*'),
    db.from('bookings').select('*'),
    db.from('staff').select('*'),
    db.from('inventory').select('*'),
    db.from('gallery').select('*')
  ]).then(function(results) {
    var svcRes=results[0], bkRes=results[1], stRes=results[2], invRes=results[3], galRes=results[4];

    if (!svcRes.error  && svcRes.data)  services  = svcRes.data;
    if (!stRes.error   && stRes.data)   staff     = stRes.data;
    if (!invRes.error  && invRes.data)  inventory = invRes.data;

    if (!bkRes.error && bkRes.data) {
      bookings = bkRes.data.map(function(b) {
        return {
          id:          b.id,
          client:      b.client_name  || b.client      || '',
          phone:       b.client_phone || b.phone        || '',
          service:     b.service_name || b.service      || '',
          fullPrice:   b.full_price   || b.fullPrice    || 0,
          depositPaid: b.deposit_paid || b.depositPaid  || 0,
          balance:     b.balance      || 0,
          date:        b.date         || '',
          time:        b.time         || '',
          status:      b.status       || 'pending'
        };
      });
    }

    if (!galRes.error && galRes.data) {
      gallery = galRes.data.map(function(g) {
        return {
          id:       g.id,
          type:     g.type     || 'image',
          service:  g.service  || '',
          fileName: g.file_name|| g.fileName || '',
          fileData: g.file_data|| g.fileData || null,
          color:    g.color    || '',
          height:   g.height   || ''
        };
      });
    }

    render();
  }).catch(function(err) {
    console.error('loadAll error:', err);
  });
}

function submitBooking() {
  if (!bookingForm.name || !bookingForm.phone || !bookingForm.service || !bookingForm.date || !bookingForm.time) {
    alert('Please fill in all fields'); return;
  }
  var svc = services.find(function(s){ return s.id==bookingForm.service; });
  if (!svc) { alert('Please select a valid service'); return; }

  var record = {
    client_name:  bookingForm.name,
    client_phone: bookingForm.phone,
    service_name: svc.name,
    service_id:   svc.id,
    full_price:   svc.price,
    deposit_paid: 0,
    balance:      svc.price,
    date:         bookingForm.date,
    time:         bookingForm.time,
    status:       'pending',
    created_at:   new Date().toISOString()
  };

  var localAdd = function(id) {
    bookings.push({ id:id||nextBkId++, client:record.client_name, phone:record.client_phone,
      service:record.service_name, fullPrice:record.full_price, depositPaid:0,
      balance:record.balance, date:record.date, time:record.time, status:'pending' });
    sendWhatsApp(record.client_phone, record.client_name);
    bookingForm = { name:'',phone:'',service:'',date:'',time:'' };
    showModal=true; modalType='bookingConfirmation'; render();
  };

  if (db) {
    db.from('bookings').insert([record]).select().then(function(r){
      localAdd(r.data && r.data[0] ? r.data[0].id : null);
    }).catch(function(){ localAdd(); });
  } else { localAdd(); }
}

function submitStaff() {
  var data = {
    name:   (el('ms-name')  && el('ms-name').value.trim())  || '',
    email:  (el('ms-email') && el('ms-email').value.trim()) || '',
    phone:  (el('ms-phone') && el('ms-phone').value.trim()) || '',
    role:   (el('ms-role')  && el('ms-role').value)         || 'staff',
    branch: (el('ms-branch')&& el('ms-branch').value.trim())|| ''
  };
  if (!data.name) { alert('Name is required'); return; }

  if (modalType==='addStaff') {
    var lp = function(id){ staff.push(Object.assign({id:id||nextStId++},data)); closeModal(); };
    if (db) { db.from('staff').insert([data]).select().then(function(r){ lp(r.data&&r.data[0]?r.data[0].id:null); reloadStaff(); }).catch(function(){ lp(); }); }
    else lp();
  } else {
    var lu = function(){ var s=staff.find(function(x){return x.id===modalData.id;}); if(s)Object.assign(s,data); closeModal(); };
    if (db) { db.from('staff').update(data).eq('id',modalData.id).then(function(){ lu(); reloadStaff(); }).catch(lu); }
    else lu();
  }
}

function submitService() {

function submitMedia() {
  var fileInput  = el('media-file-input');
  var svcEl      = el('media-service');
  if (!fileInput || !fileInput.files || !fileInput.files[0]) { alert('Please select a file'); return; }
  if (!svcEl || !svcEl.value) { alert('Please select a service category'); return; }

  var file    = fileInput.files[0];
  var service = svcEl.value;
  var isImage = modalType==='uploadImage';
  var maxSize = isImage ? 10*1024*1024 : 50*1024*1024;
  if (file.size > maxSize) { alert('File too large. Max '+(isImage?'10MB':'50MB')); return; }

  var submitBtn = document.querySelector('#modal-media-form button[type="submit"]');
  if (submitBtn) { submitBtn.disabled=true; submitBtn.textContent='Uploading...'; }

  var reader = new FileReader();
  reader.onload = function(evt) {
    var fileData = evt.target.result;
    var colors   = ['from-pink-300 to-rose-400','from-purple-300 to-indigo-400','from-amber-300 to-orange-400','from-teal-300 to-cyan-400'];
    var record   = {
      type:        isImage ? 'image' : 'video',
      service:     service,
      file_name:   file.name,
      file_data:   fileData,
      color:       colors[Math.floor(Math.random()*colors.length)],
      height:      'h-48',
      uploaded_at: new Date().toISOString()
    };
    var lp = function(id){
      gallery.push({ id:id||nextGalId++, type:record.type, service:record.service,
        fileName:record.file_name, fileData:record.file_data, color:record.color, height:record.height });
      closeModal();
    };
    if (db) { db.from('gallery').insert([record]).select().then(function(r){ lp(r.data&&r.data[0]?r.data[0].id:null); reloadGallery(); }).catch(function(){ lp(); }); }
    else lp();
  };
  reader.onerror = function(){ alert('Could not read file'); if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='Upload';} };
  reader.readAsDataURL(file);
}

function submitInventory() {
  var name  = el('inv-name')      && el('inv-name').value.trim();
  var stock = parseInt(el('inv-stock')      && el('inv-stock').value)     || 0;
  var thr   = parseInt(el('inv-threshold')  && el('inv-threshold').value) || 0;
  if (!name) { alert('Item name is required'); return; }

  var data = { name:name, stock:stock, threshold:thr, status:stock<=thr?'low':'normal' };
  var lp = function(id){ inventory.push(Object.assign({id:id||nextInvId++},data)); closeModal(); };
  if (db) { db.from('inventory').insert([data]).select().then(function(r){ lp(r.data&&r.data[0]?r.data[0].id:null); reloadInventory(); }).catch(function(){ lp(); }); }
  else lp();
}

function sendWhatsApp(phone, name) {
  var p = phone.replace(/\D/g,'');
  if (p.startsWith('0')) p = '254'+p.slice(1);
  else if (!p.startsWith('254')) p = '254'+p.slice(-9);
  var msg = encodeURIComponent('Hello '+name+', thank you for booking with Fidelis Nail Parlour! We have received your booking request and will contact you shortly to confirm your appointment and provide payment details.');
  try { window.open('https://wa.me/'+p+'?text='+msg, '_blank'); } catch(e){}
}

/* =====================================================================
   BOOT
   ===================================================================== */
document.addEventListener('DOMContentLoaded', function() {
  /* Show spinner immediately */
  var app = el('app');
  if (app) {
    app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">'
      + '<div style="text-align:center;">'
      + '<div class="spinner" style="width:48px;height:48px;margin:0 auto 16px;"></div>'
      + '<p style="color:var(--g400);font-size:.875rem;font-family:\'Outfit\',sans-serif;">Loading Fidelis...</p>'
      + '</div></div>'
      + '<style>@keyframes spin{to{transform:rotate(360deg)}}</style>';
  }
  /* Attempt Supabase session restore */
  if (db) {
    db.auth.getSession().then(function(r) {
      if (r.data && r.data.session && r.data.session.user) {
        loggedIn  = true;
        view      = 'admin';
        adminName = r.data.session.user.email.split('@')[0]||'Admin';
        render();
        loadAll();
      } else {
        render();
      }
    }).catch(function() { render(); });
  } else {
    render();
  }
});
</script>
