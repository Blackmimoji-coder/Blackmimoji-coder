<script>
'use strict';

/* CONFIG - loaded from window.FIDELIS_CONFIG (set by config.js) */
var _cfg       = (window.FIDELIS_CONFIG) || {};
var SUPA_URL   = _cfg.SUPABASE_URL  || '';
var SUPA_KEY   = _cfg.SUPABASE_KEY  || '';
var ADMIN_EMAIL= _cfg.ADMIN_EMAIL   || '';
var ADMIN_PASS = _cfg.ADMIN_PASSWORD|| '';
var ADMIN_HASH = _cfg.ADMIN_HASH    || '';
var ADMIN_SALT = _cfg.ADMIN_SALT    || '';
var db = null;
try {
  if (SUPA_URL && SUPA_KEY) db = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  else console.warn('Supabase not configured. Check config.js');
} catch(e) { console.warn('Supabase init failed:', e); }

/* =====================================================================
   APP STATE
   ===================================================================== */
var view        = 'public';   // 'public' | 'admin'
var page        = 'home';     // public page
var adminPage   = 'dashboard';
var loggedIn    = false;
var adminName   = 'Admin';
var adminRole   = 'Manager';
var sidebarOpen = true;
var mobileMenu  = false;
var loginErr    = '';
var loginLoading= false;
var galleryFilter = 'all';
var showModal   = false;
var modalType   = '';
var modalData   = null;
var bookingForm = { name:'', phone:'', service:'', date:'', time:'' };
var salonSettings = { logo:'heart', heroImage:'' }; /* editable icons/images */

/* data arrays - populated from Supabase */
var services    = [];
var bookings    = [];
var staff       = [];
var inventory   = [];
var gallery     = [];

/* id counters for offline fallback */
var nextSvcId=1,nextBkId=1,nextStId=1,nextInvId=1,nextGalId=1;

var STATUS_COLORS = {
  pending:     'background:#FEF9C3;color:#854D0E',
  deposit_paid:'background:#DBEAFE;color:#1D4ED8',
  approved:    'background:#DCFCE7;color:#15803D',
  completed:   'background:#D1FAE5;color:#047857',
  cancelled:   'background:#F3F4F6;color:#374151',
  no_show:     'background:#FEE2E2;color:#991B1B'
};
var STATUS_LABELS = {
  pending:'Pending', deposit_paid:'Deposit Paid', approved:'Approved',
  completed:'Completed', cancelled:'Cancelled', no_show:'No Show'
};

var config = {
  salon_name: 'Fidelis Nail Parlour',
  tagline: 'Where Beauty Meets Elegance',
  phone: '+254 700 000 000',
  email: 'hello@fidelisnails.com',
  location: 'Nakuru, Gilgil - Main Road'
};

/* =====================================================================
   HELPERS
   ===================================================================== */
function kes(n) { return 'KES ' + (Number(n)||0).toLocaleString(); }
function initials(name) {
  if (!name) return '?';
  return name.split(' ').map(function(w){ return w[0]||''; }).join('').toUpperCase().slice(0,2);
}
function el(id) { return document.getElementById(id); }
function svgIcon(path, cls) {
  return '<svg class="'+cls+'" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>';
}

/* =====================================================================
   RENDER ENGINE
   ===================================================================== */
function render() {
  var app = el('app');
  if (!app) return;
  try {
    if (view === 'public') {
      app.innerHTML = renderPublic();
    } else if (!loggedIn) {
      app.innerHTML = renderLogin();
    } else {
      app.innerHTML = renderAdmin();
    }
    bindEvents();
  } catch(e) {
    console.error('Render error:', e);
    app.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;">'
      + '<h2 style="color:#e53e3e;margin-bottom:8px;">Something went wrong</h2>'
      + '<p style="color:#666;margin-bottom:16px;">' + (e.message||String(e)) + '</p>'
      + '<button onclick="loggedIn=false;view=\'public\';render()" style="padding:10px 20px;background:#000;color:#fff;border:none;border-radius:8px;cursor:pointer;">Reset</button>'
      + '</div>';
  }
}

/* =====================================================================
   PUBLIC SITE
   ===================================================================== */
function renderPublic() {
  var content = '';
  if (page === 'home')     content = renderHome();
  if (page === 'services') content = renderServices();
  if (page === 'booking')  content = renderBooking();
  if (page === 'gallery')  content = renderGalleryPage();
  return renderHeader() + '<main>' + content + '</main>' + renderFooter() + (showModal ? renderModal() : '');
}

function renderHeader() {
  var links = [
    {id:'home',label:'Home'},{id:'services',label:'Services'},
    {id:'gallery',label:'Gallery'}
  ];
  var desktopLinks = links.map(function(l){
    var active = page===l.id ? 'color:#000;font-weight:600;' : 'color:var(--g500);';
    return '<button onclick="go(\''+l.id+'\')" style="font-size:.875rem;font-weight:500;'+active+'background:none;border:none;cursor:pointer;transition:color .15s">'+l.label+'</button>';
  }).join('');

  var mobileLinksHtml = '';
  if (mobileMenu) {
    mobileLinksHtml = '<div style="border-top:1px solid var(--g200);padding:12px 16px;display:flex;flex-direction:column;gap:4px;" class="fade-in">'
      + links.map(function(l){
          var bg = page===l.id ? 'background:var(--p100);color:#000;' : 'color:var(--g700);';
          return '<button onclick="go(\''+l.id+'\')" style="text-align:left;padding:12px 16px;border-radius:var(--radius);font-weight:500;'+bg+'background:none;border:none;cursor:pointer;transition:.15s">'+l.label+'</button>';
        }).join('')
      + '<button onclick="go(\'booking\')" style="margin-top:4px;padding:12px 16px;background:#000;color:#fff;border-radius:var(--radius);font-weight:500;border:none;cursor:pointer;">Book Appointment</button>'
      + '<button onclick="goAdmin()" style="margin-top:4px;padding:10px;font-size:.75rem;color:var(--g500);background:none;border:none;cursor:pointer;">Admin Access</button>'
      + '</div>';
  }

  return '<header style="position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--g200);">'
    + '<nav style="max-width:80rem;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;">'
    + '<button onclick="go(\'home\')" style="display:flex;align-items:center;gap:10px;background:none;border:none;cursor:pointer;">'
    +   '<div style="width:40px;height:40px;background:linear-gradient(135deg,var(--p200),var(--p300));border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);">'
    +     svgIcon('<path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>','')
    +   '</div>'
    +   '<span style="font-family:\'Playfair Display\',serif;font-size:1.125rem;font-weight:600;">'+config.salon_name+'</span>'
    + '</button>'
    + '<div class="hide-mobile" style="display:flex;align-items:center;gap:32px;">'
    + desktopLinks
    + '<button onclick="go(\'booking\')" style="background:#000;color:#fff;padding:10px 20px;border-radius:var(--radius-full);font-size:.875rem;font-weight:500;border:none;cursor:pointer;box-shadow:var(--shadow-sm);">Book Now</button>'
    + '<button onclick="goAdmin()" style="font-size:.75rem;color:var(--g400);background:none;border:none;cursor:pointer;">[lock] Admin</button>'
    + '</div>'
    + '<button id="menuBtn" class="md-hidden" style="padding:8px;border-radius:var(--radius-sm);background:none;border:none;cursor:pointer;">'
    +   svgIcon(mobileMenu ? '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' : '<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>','')
    + '</button>'
    + '</nav>'
    + mobileLinksHtml
    + '</header>';
}

function renderFooter() {
  return '<footer style="background:#000;color:#fff;padding:48px 24px 24px;">'
    + '<div style="max-width:80rem;margin:0 auto;">'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px;margin-bottom:32px;">'

/* --- ADMIN PAGE CONTENTS --- */
function getAdminPageContent() {
  if (adminPage==='dashboard')  return renderDashboard();
  if (adminPage==='bookings')   return renderBookingsMgmt();
  if (adminPage==='staff')      return renderStaffMgmt();
  if (adminPage==='services')   return renderServicesMgmt();
  if (adminPage==='svcimages')  return renderServiceImages();
  if (adminPage==='gallery')    return renderGalleryMgmt();
  if (adminPage==='inventory')  return renderInventoryMgmt();
  if (adminPage==='analytics')  return renderAnalytics();
  if (adminPage==='settings')   return renderSalonSettings();
  return '';
}

function renderDashboard() {
  var completed = bookings.filter(function(b){ return b.status==='completed'; });
  var pending   = bookings.filter(function(b){ return b.status==='pending'; });
  var revenue   = completed.reduce(function(s,b){ return s+(b.fullPrice||0); },0);
  var deposits  = pending.reduce(function(s,b){ return s+((b.fullPrice||0)*0.5); },0);
  var lowStock  = inventory.filter(function(i){ return i.status===1 || i.status==='low' || (i.stock<=i.threshold && i.threshold>0); }).length;

  var stats = [
    {label:"Revenue",      val:kes(revenue),      bg:'#ECFDF5',color:'#059669',
     icon:'<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>'},
    {label:"Deposits Due", val:kes(deposits),      bg:'#EFF6FF',color:'#2563EB',
     icon:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'},
    {label:"Bookings",     val:bookings.length,    bg:'#FFF7ED',color:'#EA580C',
     icon:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>'},
    {label:"Low Stock",    val:lowStock,            bg:'#FEF2F2',color:'#DC2626',
     icon:'<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>'}
  ].map(function(s){
    return '<div class="adm-card">'
      + '<div class="adm-stat-icon" style="background:'+s.bg+';color:'+s.color+';">'
      + '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">'+s.icon+'</svg>'
      + '</div>'
      + '<div class="adm-label">'+s.label+'</div>'
      + '<div class="adm-val">'+s.val+'</div>'
      + '</div>';
  }).join('');

  var recentRows = bookings.slice(0,5).map(function(b){
    var sc = STATUS_COLORS[b.status||'pending'] || 'background:var(--g100);color:var(--g700)';
    return '<tr>'
      + '<td class="adm-td" style="font-weight:600;">'+(b.client||'-')+'</td>'
      + '<td class="adm-td" style="color:var(--g500);max-width:90px;overflow:hidden;text-overflow:ellipsis;">'+(b.service||'-')+'</td>'
      + '<td class="adm-td"><span class="adm-badge" style="'+sc+'">'+(STATUS_LABELS[b.status]||'-')+'</span></td>'
      + '</tr>';
  }).join('');

  return '<div style="display:flex;flex-direction:column;gap:10px;padding-bottom:72px;" class="fade-in">'
    + '<div class="adm-grid-2">'+stats+'</div>'
    + '<div class="adm-section">'
    + '<div class="adm-row" style="border-bottom:1px solid #F0F0F0;">'
    + '<span style="font-size:.82rem;font-weight:700;">Recent Bookings</span>'
    + '<button onclick="setAdminPage(this.getAttribute(\'data-p\'))" data-p="bookings" style="font-size:.72rem;color:var(--p600);background:none;border:none;cursor:pointer;font-weight:600;">View All</button>'
    + '</div>'
    + '<div style="overflow-x:auto;">'
    + '<table style="width:100%;"><thead style="background:var(--g50);"><tr>'
    + ['Client','Service','Status'].map(function(h){ return '<th class="adm-th">'+h+'</th>'; }).join('')
    + '</tr></thead><tbody>'
    + (recentRows || '<tr><td colspan="3" style="padding:20px;text-align:center;color:var(--g400);font-size:.78rem;">No bookings yet</td></tr>')
    + '</tbody></table>'
    + '</div></div></div>';
}
function renderBookingsMgmt() {
  var rows = bookings.map(function(b){
    var sc = STATUS_COLORS[b.status||'pending'] || 'background:var(--g100);color:var(--g700)';
    var actions = '';
    if (b.status==='pending') {
      actions = '<button class="adm-btn-sm" onclick="updateStatus('+b.id+',\'approved\')" style="background:#DCFCE7;color:#15803D;">OK</button>'
              + '<button class="adm-btn-sm" onclick="updateStatus('+b.id+',\'cancelled\')" style="background:#FEE2E2;color:#991B1B;margin-left:4px;">X</button>';
    } else if (b.status==='approved') {
      actions = '<button class="adm-btn-sm" onclick="updateStatus('+b.id+',\'completed\')" style="background:#D1FAE5;color:#047857;">Done</button>'
              + '<button class="adm-btn-sm" onclick="updateStatus('+b.id+',\'no_show\')" style="background:#FEE2E2;color:#991B1B;margin-left:4px;">NS</button>';
    } else if (b.status==='deposit_paid') {
      actions = '<button class="adm-btn-sm" onclick="updateStatus('+b.id+',\'approved\')" style="background:#DCFCE7;color:#15803D;">OK</button>';
    } else {
      actions = '<span style="font-size:.7rem;color:var(--g300);">-</span>';
    }
    return '<tr style="border-bottom:1px solid #F5F5F5;">'
      + '<td class="adm-td" style="font-weight:600;">'+(b.client||'-')+'</td>'
      + '<td class="adm-td" style="color:var(--g500);">'+(b.service||'-')+'</td>'
      + '<td class="adm-td" style="color:var(--g500);">'+(b.date||'-')+'</td>'
      + '<td class="adm-td"><span class="adm-badge" style="'+sc+'">'+(STATUS_LABELS[b.status]||'-')+'</span></td>'
      + '<td class="adm-td">'+actions+'</td>'
      + '</tr>';
  }).join('');

  return '<div class="fade-in" style="padding-bottom:72px;">'
    + '<div class="adm-page-hdr"><div><div class="adm-page-title">Bookings</div><div class="adm-page-sub">'+bookings.length+' total</div></div></div>'
    + '<div class="adm-section"><div style="overflow-x:auto;">'
    + '<table style="width:100%;"><thead style="background:var(--g50);"><tr>'
    + ['Client','Service','Date','Status',''].map(function(h){ return '<th class="adm-th">'+h+'</th>'; }).join('')
    + '</tr></thead><tbody>'
    + (rows || '<tr><td colspan="5" style="padding:24px;text-align:center;color:var(--g400);font-size:.78rem;">No bookings yet.</td></tr>')
    + '</tbody></table></div></div></div>';
}
function actionBtn(bg, color) {
  return 'padding:5px 10px;border-radius:var(--radius-sm);font-size:.75rem;font-weight:600;cursor:pointer;border:none;background:'+bg+';color:'+color+';';
}

function renderStaffMgmt() {
  var rows = staff.map(function(m){
    var roleBg = m.role==='owner' ? '#F3E8FF;color:#7C3AED' : '#DBEAFE;color:#1D4ED8';
    return '<div class="adm-staff-row">'
      + '<div style="display:flex;align-items:center;gap:10px;min-width:0;">'
      + '<div class="adm-avatar">'+initials(m.name)+'</div>'
      + '<div style="min-width:0;">'
      + '<div style="font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+(m.name||'-')+'</div>'
      + '<span class="adm-badge" style="background:'+roleBg+';">'+(m.role||'staff')+'</span>'
      + '</div></div>'
      + '<div style="display:flex;gap:5px;flex-shrink:0;">'
      + '<button class="adm-btn-sm" onclick="openModalById(\'editStaff\',this.getAttribute(\'data-id\'))" data-id="'+m.id+'" style="background:var(--g100);color:var(--g700);">Edit</button>'
      + '<button class="adm-btn-sm" onclick="deleteStaff('+m.id+')" style="background:#FEE2E2;color:#991B1B;">Del</button>'
      + '</div></div>';
  }).join('');

  return '<div class="fade-in" style="padding-bottom:72px;">'
    + '<div class="adm-page-hdr">'
    + '<div><div class="adm-page-title">Staff</div><div class="adm-page-sub">'+staff.length+' members</div></div>'
    + '<button class="adm-add-btn" onclick="openModal(\'addStaff\')">+ Add</button>'
    + '</div>'
    + '<div class="adm-section">'
    + (staff.length ? rows : '<div style="padding:24px;text-align:center;color:var(--g400);font-size:.78rem;">No staff added yet.</div>')
    + '</div></div>';
}
function renderServicesMgmt() {
  var rows = services.map(function(s){
    var svcRowImg = s.gallery_id ? gallery.find(function(g){return g.id==s.gallery_id;}) : null;
    var svcRowThumb = svcRowImg && svcRowImg.fileData
      ? '<img src="'+svcRowImg.fileData+'" style="width:36px;height:36px;border-radius:6px;object-fit:cover;flex-shrink:0;">'
      : '<div style="width:36px;height:36px;border-radius:6px;background:linear-gradient(135deg,var(--p100),var(--p200));flex-shrink:0;"></div>';
    return '<div class="adm-row">'
      + svcRowThumb
      + '<div style="min-width:0;flex:1;margin-left:10px;">'
      + '<div style="font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+(s.name||'-')+'</div>'
      + '<div style="font-size:.7rem;color:var(--g400);margin-top:1px;">'+(s.category||'-')+' &bull; '+(s.duration||'-')+'</div>'
      + '</div>'
      + '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">'
      + '<span style="font-size:.82rem;font-weight:700;color:var(--p600);">'+kes(s.price)+'</span>'
      + '<button class="adm-btn-sm" onclick="openModalById(\'editService\',this.getAttribute(\'data-id\'))" data-id="'+s.id+'" style="background:var(--g100);color:var(--g700);">Edit</button>'
      + '<button class="adm-btn-sm" onclick="deleteService('+s.id+')" style="background:#FEE2E2;color:#991B1B;">Del</button>'
      + '</div></div>';
  }).join('');

  return '<div class="fade-in" style="padding-bottom:72px;">'
    + '<div class="adm-page-hdr">'
    + '<div><div class="adm-page-title">Services</div><div class="adm-page-sub">'+services.length+' services</div></div>'
    + '<button class="adm-add-btn" onclick="openModal(\'addService\')">+ Add</button>'
    + '</div>'
    + '<div class="adm-section">'
    + (services.length ? rows : '<div style="padding:24px;text-align:center;color:var(--g400);font-size:.78rem;">No services added yet.</div>')
    + '</div></div>';
}
function renderGalleryMgmt() {
  var items = gallery.map(function(g){
    var inner = g.fileData
      ? (g.type==='video'
          ? '<video src="'+g.fileData+'" style="width:100%;height:100%;object-fit:cover;"></video>'
          : '<img src="'+g.fileData+'" style="width:100%;height:100%;object-fit:cover;" loading="lazy">')
      : '<div style="width:100%;height:100%;background:linear-gradient(135deg,var(--p100),var(--p300));"></div>';
    return '<div class="adm-gal-item">'
      + inner
      + '<button class="adm-gal-del" onclick="deleteGalleryItem('+g.id+')">'
      + '<svg width="10" height="10" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
      + '</button>'
      + '<div style="position:absolute;bottom:3px;left:4px;font-size:.55rem;background:rgba(0,0,0,.55);color:#fff;padding:1px 5px;border-radius:3px;">'+( g.service||'')+'</div>'
      + '</div>';
  }).join('');

  return '<div class="fade-in" style="padding-bottom:72px;">'
    + '<div class="adm-page-hdr">'

function renderInventoryMgmt() {
  var lowCount = inventory.filter(function(i){ return i.status===1 || i.status==='low' || (i.stock<=i.threshold && i.threshold>0); }).length;

  var rows = inventory.map(function(item){
    var isLow = item.status===1 || item.status==='low' || (item.stock<=item.threshold && item.threshold>0);
    var invImg = item.gallery_id ? gallery.find(function(g){return g.id==item.gallery_id;}) : null;
    var invThumb = invImg && invImg.fileData
      ? '<img src="'+invImg.fileData+'" style="width:32px;height:32px;border-radius:6px;object-fit:cover;flex-shrink:0;">'
      : '<div style="width:32px;height:32px;border-radius:6px;background:var(--g100);flex-shrink:0;"></div>';

      + '<div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1;">'

      + '<div style="font-size:.7rem;color:var(--g400);margin-top:1px;">Threshold: '+(item.threshold||0)+'</div>'
      + '</div>'
      + '</div>'
      + '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">'
      + '<span style="font-size:.85rem;font-weight:700;color:'+(isLow?'#DC2626':'#15803D')+';">'+(item.stock||0)+'</span>'
      + '<span class="adm-badge" style="background:'+(isLow?'#FEE2E2;color:#991B1B':'#DCFCE7;color:#15803D')+'">'+(isLow?'Low':'OK')+'</span>'
      + '<button class="adm-btn-sm" onclick="deleteInventory('+item.id+')" style="background:#FEE2E2;color:#991B1B;">Del</button>'

function assignGalleryCategory(id, cat) {
  var g = gallery.find(function(x){ return x.id===id; });
  if (g) { g.service = cat; }
  if (db) {
    db.from('gallery').update({service:cat}).eq('id',id)
      .then(function(r){ if(r.error) console.error('Update category:',r.error); })
      .catch(function(e){ console.error(e); });
  }
}

function renderAnalytics() {
  var completed = bookings.filter(function(b){ return b.status==='completed'; }).length;
  var total     = bookings.length;
  var rate      = total>0 ? Math.round((completed/total)*100) : 0;
  var revenue   = bookings.filter(function(b){ return b.status==='completed'; }).reduce(function(s,b){ return s+(b.fullPrice||0); },0);

  var stats = [
    {label:'Bookings',      val:total},
    {label:'Completed',     val:completed},
    {label:'Success Rate',  val:rate+'%'},
    {label:'Revenue',       val:kes(revenue)},
    {label:'Services',      val:services.length},
    {label:'Staff',         val:staff.length},
    {label:'Gallery Items', val:gallery.length},
    {label:'Low Stock',     val:inventory.filter(function(i){return i.status===1||i.status==='low'||(i.stock<=i.threshold&&i.threshold>0);}).length}
  ].map(function(s){
    return '<div class="adm-card" style="text-align:center;">'
      + '<div class="adm-val" style="font-size:1.25rem;margin-bottom:2px;">'+s.val+'</div>'
      + '<div class="adm-label">'+s.label+'</div>'
      + '</div>';
  }).join('');

  return '<div class="fade-in" style="padding-bottom:72px;">'
    + '<div class="adm-page-hdr"><div><div class="adm-page-title">Analytics</div><div class="adm-page-sub">Business overview</div></div></div>'
    + '<div class="adm-grid-2" style="grid-template-columns:repeat(2,1fr)!important;">'+stats+'</div>'
    + '</div>';
}

function buildGalleryOptions(selectedId) {
  var opts = '<option value="">No image</option>';
  gallery.filter(function(g){ return g.type==='image'; }).forEach(function(g){
    var sel = (selectedId && String(selectedId)===String(g.id)) ? ' selected' : '';
    opts += '<option value="' + g.id + '"' + sel + '>' + (g.fileName||'Image '+g.id) + '</option>';
  });
  return opts;
}

/* =====================================================================
   EVENT BINDING (called after every render)
   ===================================================================== */
function bindEvents() {
  /* mobile menu button */
  var menuBtn = el('menuBtn');
  if (menuBtn) {
    menuBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      mobileMenu = !mobileMenu;
      render();
    });
  }

  /* login form */
  var loginForm = el('login-form');
  if (loginForm) {
    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      doLogin_attempt();
    });
  }

  /* booking form */
  var bkForm = el('booking-form');
  if (bkForm) {
    bkForm.addEventListener('submit', function(e) {
      e.preventDefault();
      submitBooking();
    });
  }

  /* modal forms */
  var staffForm = el('modal-staff-form');
  if (staffForm) staffForm.addEventListener('submit', function(e){ e.preventDefault(); submitStaff(); });

  var svcForm = el('modal-service-form');
  if (svcForm) svcForm.addEventListener('submit', function(e){ e.preventDefault(); submitService(); });

  var mediaForm = el('modal-media-form');
  if (mediaForm) mediaForm.addEventListener('submit', function(e){ e.preventDefault(); submitMedia(); });

  var invForm = el('modal-inventory-form');
  if (invForm) invForm.addEventListener('submit', function(e){ e.preventDefault(); submitInventory(); });

  /* settings form */
  var settingsForm = el('settings-form');
  if (settingsForm) {
    settingsForm.addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = el('settings-save-btn');
      if (btn) { btn.disabled=true; btn.textContent='Saving...'; }
      config.salon_name = (el('cfg-name')  && el('cfg-name').value.trim())  || config.salon_name;
      config.tagline    = (el('cfg-tag')   && el('cfg-tag').value.trim())   || config.tagline;
      config.phone      = (el('cfg-phone') && el('cfg-phone').value.trim()) || config.phone;
      config.email      = (el('cfg-email') && el('cfg-email').value.trim()) || config.email;
      config.location   = (el('cfg-loc')   && el('cfg-loc').value.trim())   || config.location;
      render(); /* update UI immediately */
      saveConfigToDB(function(ok) {
        if (btn) {
          btn.disabled = false;
          btn.textContent = ok ? 'Saved!' : 'Save Failed - Try Again';
          setTimeout(function(){ btn.textContent='Save Changes'; }, 2500);
        }
      });
    });
  }

  /* file input label update */
  var fileInput = el('media-file-input');
  if (fileInput) {
    fileInput.addEventListener('change', function() {
      var lbl = el('media-file-label');
      if (lbl && this.files && this.files[0]) lbl.textContent = this.files[0].name;
    });
  }
}

/* =====================================================================
   LOGIN
   ===================================================================== */
function doLogin_attempt() {
  var emailEl = el('login-email');
  var passEl  = el('login-password');
  if (!emailEl || !passEl) { loginErr='Form error - please reload'; render(); return; }

  var email = emailEl.value.trim().toLowerCase();
  var pass  = passEl.value;

  if (!email || !pass) { loginErr='Please enter your email and password'; render(); return; }

  loginErr = ''; loginLoading = true; render();

  /* SHA-256 via SubtleCrypto */
  /* Check 1: direct password match from config.js */
  if (ADMIN_EMAIL && email === ADMIN_EMAIL && ADMIN_PASS && pass === ADMIN_PASS) {
    finishLogin('Admin', 'Manager');
    if (db) db.auth.signInWithPassword({ email: email, password: pass }).catch(function(){});
    return;
  }

  /* Check 2: SHA-256 hash match (fallback if ADMIN_PASS not set) */
  if (ADMIN_EMAIL && ADMIN_HASH && ADMIN_SALT && crypto && crypto.subtle) {
    var enc  = new TextEncoder();
    crypto.subtle.digest('SHA-256', enc.encode(pass + ADMIN_SALT)).then(function(buf) {
      var hex = Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      if (email === ADMIN_EMAIL && hex === ADMIN_HASH) {
        finishLogin('Admin', 'Manager');
        if (db) db.auth.signInWithPassword({ email: email, password: pass }).catch(function(){});
        return;
      }
      trySupabase(email, pass);
    }).catch(function(){ trySupabase(email, pass); });
    return;
  }

  /* Check 3: Supabase auth */
  trySupabase(email, pass);
}

function trySupabase(email, pass) {
  if (!db) {
    loginLoading = false;
    loginErr = 'Incorrect email or password';
    render(); return;
  }
  db.auth.signInWithPassword({ email: email, password: pass }).then(function(result) {
    if (result.error) {
      loginLoading = false;
      var msg = result.error.message || 'Incorrect email or password';
      if (msg.toLowerCase().indexOf('confirm') !== -1) {
        msg = 'Email not confirmed. In Supabase: Authentication -> Providers -> Email -> disable Confirm email.';
      }
      loginErr = msg; render();
    } else if (result.data && result.data.user) {
      finishLogin(result.data.user.email.split('@')[0] || 'Admin', 'Manager');
    } else {
      loginLoading = false; loginErr = 'Login failed. Check your credentials.'; render();
    }
  }).catch(function(err) {
    loginLoading = false;
    loginErr = 'Connection error: ' + (err.message || 'Try again');
    render();
  });
}

function finishLogin(name, role) {
  loggedIn = true; view = 'admin';
  adminName = name; adminRole = role;
  loginErr = ''; loginLoading = false;
  // Persist so admin stays logged in after refresh
  try {
    localStorage.setItem('fidelis_admin', JSON.stringify({ name: name, role: role }));
  } catch(e) {}
  render();
  if (db) loadAll();
}

function doLogout() {
  loggedIn = false; view = 'public';
  /* Keep data arrays in memory so public site doesn't flash empty */
  /* Only clear admin-sensitive data */
  staff     = [];
  inventory = [];
  try { localStorage.removeItem('fidelis_admin'); } catch(e) {}
  if (db) db.auth.signOut().catch(function(){});
  render();
  syncSupabase(); /* re-sync public data quietly */
}

function loadAll() {
  if (!db) return;
  Promise.all([
    db.from('services').select('*'),
    db.from('bookings').select('*'),
    db.from('staff').select('*'),
    db.from('inventory').select('*'),
    db.from('gallery').select('*')
  ]).then(function(results) {
    var svcRes=results[0], bkRes=results[1], stRes=results[2], invRes=results[3], galRes=results[4];

    if (!svcRes.error  && svcRes.data  && svcRes.data.length  > 0) services  = svcRes.data;
    if (!stRes.error   && stRes.data   && stRes.data.length   > 0) staff     = stRes.data;
    if (!invRes.error  && invRes.data  && invRes.data.length  > 0) inventory = invRes.data;

    if (!bkRes.error && bkRes.data) {
      bookings = bkRes.data.map(function(b) {
        return {
          id:          b.id,
          client:      b.client_name  || b.client      || '',
          phone:       b.client_phone || b.phone        || '',
          service:     b.service_name || b.service      || '',
          fullPrice:   b.full_price   || b.fullPrice    || 0,
          depositPaid: b.deposit_paid || b.depositPaid  || 0,
          balance:     b.balance      || 0,
          date:        b.date         || '',
          time:        b.time         || '',
          status:      b.status       || 'pending'
        };
      });
    }

    if (!galRes.error && galRes.data && galRes.data.length > 0) {
      gallery = galRes.data.map(function(g) {
        return {
          id:       g.id,
          type:     (g.type===1||g.type==='1'||g.type==='video') ? 'video' : 'image',
          service:  g.service  || '',
          fileName: g.file_name|| g.fileName || '',
          fileData: g.file_data|| g.fileData || null
        };
      });
    }

    render();
  }).catch(function(err) {
    console.error('loadAll error:', err);
  });
}

function submitBooking() {
  /* Read directly from DOM - avoids state loss when render() fires on service change */
  var nameVal  = (el('bk-name')    && el('bk-name').value.trim())    || bookingForm.name;
  var phoneVal = (el('bk-phone')   && el('bk-phone').value.trim())   || bookingForm.phone;
  var svcVal   = (el('bk-service') && el('bk-service').value)        || bookingForm.service;
  var dateVal  = (el('bk-date')    && el('bk-date').value)           || bookingForm.date;
  var timeVal  = (el('bk-time')    && el('bk-time').value)           || bookingForm.time;

  if (!nameVal || !phoneVal || !svcVal || !dateVal || !timeVal) {
    alert('Please fill in all fields (Name, Phone, Service, Date and Time)'); return;
  }
  var svc = services.find(function(s){ return s.id==svcVal || String(s.id)==String(svcVal); });
  if (!svc) { alert('Please select a valid service'); return; }

  var record = {
    client_name:  nameVal,
    client_phone: phoneVal,
    service_name: svc.name,
    full_price:   svc.price,
    deposit_paid: 0,
    balance:      svc.price,
    date:         dateVal,
    time:         timeVal,
    status:       'pending',
    created_at:   new Date().toISOString()
  };

  var localAdd = function(id) {
    bookings.push({ id:id||nextBkId++, client:record.client_name, phone:record.client_phone,
      service:record.service_name, fullPrice:record.full_price, depositPaid:0,
      balance:record.balance, date:record.date, time:record.time, status:'pending' });
    notifyWhatsApp(record.client_name, record.client_phone, svc.name, record.date, record.time, svc.price);
    bookingForm = { name:'',phone:'',service:'',date:'',time:'' }; saveCache();
    showModal=true; modalType='bookingConfirmation'; render();
  };

  if (db) {
    db.from('bookings').insert([record]).select()
      .then(function(r){
        if (r.error) {
          console.error('Booking insert error:', r.error);
          alert('Booking failed to save: ' + r.error.message + '\n\nPlease screenshot this and contact the salon directly at +254748956804');
        } else {
          localAdd(r.data && r.data[0] ? r.data[0].id : null);
        }
      })
      .catch(function(e){
        console.error('Booking insert catch:', e);
        alert('Connection error. Please try again or contact us on WhatsApp: +254748956804');
      });
  } else { localAdd(); }
}

  var file    = fileInput.files[0];

  var isImage = modalType==='uploadImage';
  var maxSize = isImage ? 10*1024*1024 : 50*1024*1024;
  if (file.size > maxSize) { alert('File too large. Max '+(isImage?'10MB':'50MB')); return; }

  var submitBtn = document.querySelector('#modal-media-form button[type="submit"]');
  if (submitBtn) { submitBtn.disabled=true; submitBtn.textContent='Uploading...'; }

  var reader = new FileReader();
  reader.onload = function(evt) {
    var fileData = evt.target.result;
    var record   = {
      type:        isImage ? 'image' : 'video',
      service:     service,
      file_name:   file.name,
      file_data:   fileData,
      created_at:  new Date().toISOString()
    };

      gallery.push({ id:id||nextGalId++, type:record.type, service:record.category,
        fileName:record.file_name, fileData:record.file_data });

    };

        }).catch(function(e){ console.error(e); lp(); });
    } else lp();
  };

}

/* =====================================================================

   ===================================================================== */
function saveCache() {
  if (!window.localStorage) return;
  try {
    localStorage.setItem('fidelis_data', JSON.stringify({
      services:  services,
      gallery:   gallery.map(function(g){ return {id:g.id,type:g.type,service:g.service,fileName:g.fileName}; }),
      bookings:  bookings.slice(0,100),
      staff:     staff,
      inventory: inventory
    }));
  } catch(e) { /* storage full or unavailable */ }
}

function loadCache() {
  if (!window.localStorage) return false;
  try {
    var cached = JSON.parse(localStorage.getItem('fidelis_data'));
    if (cached) {
      if (cached.services  && cached.services.length)  services  = cached.services;
      if (cached.gallery   && cached.gallery.length)   gallery   = cached.gallery;
      if (cached.bookings  && cached.bookings.length)  bookings  = cached.bookings;
      if (cached.staff     && cached.staff.length)     staff     = cached.staff;
      if (cached.inventory && cached.inventory.length) inventory = cached.inventory;
      return true;
    }
  } catch(e) {}
  return false;
}

function loadConfigFromDB(callback) {
  if (!db) { callback && callback(); return; }
  db.from('config').select('key, value').then(function(r) {
    if (!r.error && r.data && r.data.length > 0) {
      r.data.forEach(function(row) {
        if (row.key === 'salon_name') config.salon_name = row.value;
        if (row.key === 'tagline')    config.tagline    = row.value;
        if (row.key === 'phone')      config.phone      = row.value;
        if (row.key === 'email')      config.email      = row.value;
        if (row.key === 'location')   config.location   = row.value;
      });
    }
    callback && callback();
  }).catch(function() { callback && callback(); });
}

function saveConfigToDB(callback) {
  if (!db) {
    callback && callback(false);
    return;
  }
  var rows = [
    { key: 'salon_name', value: config.salon_name },
    { key: 'tagline',    value: config.tagline },
    { key: 'phone',      value: config.phone },
    { key: 'email',      value: config.email },
    { key: 'location',   value: config.location }
  ];
  /* Upsert each row */
  Promise.all(rows.map(function(row) {
    return db.from('config').upsert(row, { onConflict: 'key' });
  })).then(function(results) {
    var anyError = results.find(function(r) { return r.error; });
    callback && callback(!anyError);
  }).catch(function() { callback && callback(false); });
}

/* =====================================================================
   BOOT
   ===================================================================== */
document.addEventListener('DOMContentLoaded', function() {
  /* Step 1: restore data from localStorage cache for instant render */
  loadCache();

  /* Step 3: restore admin session */
  var savedAdmin = null;
  try { savedAdmin = JSON.parse(localStorage.getItem('fidelis_admin')); } catch(e) {}
  if (savedAdmin && savedAdmin.name) {
    loggedIn  = true;
    view      = 'admin';
    adminName = savedAdmin.name;
    adminRole = savedAdmin.role || 'Manager';
  }

  /* Step 4: render immediately with cached data (no spinner, no wait) */
  render();

  /* Step 5: load config from Supabase, then sync all data */
  if (db) {
    loadConfigFromDB(function() {
      render(); /* re-render with correct config */
      syncSupabase();
    });
  }
});

function syncSupabase() {
  if (!db) return;
  /* Always sync public data */
  var queries = [
    db.from('services').select('*'),
    db.from('gallery').select('*'),
    db.from('bookings').select('*').order('created_at', {ascending: false}).limit(100)
  ];
  /* Add admin-only data if logged in */
  if (loggedIn) {
    queries.push(db.from('staff').select('*'));
    queries.push(db.from('inventory').select('*'));
  }
  Promise.all(queries).then(function(results) {
    var changed = false;
    var svcRes = results[0];
    var galRes = results[1];
    var bkRes  = results[2];
    var stRes  = results[3];
    var invRes = results[4];

    if (!svcRes.error && svcRes.data) {
      services = svcRes.data; changed = true;
    }
    if (!galRes.error && galRes.data) {
      gallery = galRes.data.map(function(g) {
        return { id:g.id, type:g.type||'image', service:g.service||'', fileName:g.file_name||g.fileName||'', fileData:g.file_data||g.fileData||null };
      }); changed = true;
    }
    if (!bkRes.error && bkRes.data) {
      bookings = bkRes.data.map(function(b) {
        return { id:b.id, client:b.client_name||b.client||'', phone:b.client_phone||b.phone||'',
          service:b.service_name||b.service||'', fullPrice:b.full_price||b.fullPrice||0,
          depositPaid:b.deposit_paid||b.depositPaid||0, balance:b.balance||0,
          date:b.date||'', time:b.time||'', status:b.status||'pending' };
      }); changed = true;
    }
    if (stRes  && !stRes.error  && stRes.data)  { staff     = stRes.data;  changed = true; }
    if (invRes && !invRes.error && invRes.data)  { inventory = invRes.data; changed = true; }

    if (changed) { saveCache(); render(); }
  }).catch(function(err) { console.error('Supabase sync error:', err); });
}
