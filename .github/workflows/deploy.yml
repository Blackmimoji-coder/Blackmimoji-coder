name: Deploy to GitHub Pages - Production Grade

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    outputs:
      config-valid: ${{ steps.validate.outputs.valid }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Required Secrets
        id: validate
        run: |
          set -e
          
          # Validate all required secrets exist and are non-empty
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "::error::SUPABASE_URL secret is missing or empty"
            exit 1
          fi
          
          if [ -z "${{ secrets.SUPABASE_KEY }}" ]; then
            echo "::error::SUPABASE_KEY secret is missing or empty"
            exit 1
          fi
          
          if [ -z "${{ secrets.ADMIN_EMAIL }}" ]; then
            echo "::error::ADMIN_EMAIL secret is missing or empty"
            exit 1
          fi
          
          if [ -z "${{ secrets.ADMIN_HASH }}" ]; then
            echo "::error::ADMIN_HASH secret is missing or empty"
            exit 1
          fi
          
          if [ -z "${{ secrets.ADMIN_SALT }}" ]; then
            echo "::error::ADMIN_SALT secret is missing or empty"
            exit 1
          fi
          
          echo "valid=true" >> $GITHUB_OUTPUT
          echo "✅ All required secrets are configured"

      - name: Validate HTML File Exists
        run: |
          if [ ! -f "index.html" ]; then
            echo "::error::index.html not found in repository root"
            exit 1
          fi
          echo "✅ index.html exists"

  build:
    name: Build & Prepare Deployment
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      artifact-hash: ${{ steps.hash.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create Deployment Directory
        run: |
          mkdir -p deploy_artifacts
          echo "Deployment started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > deploy_artifacts/DEPLOYMENT_MANIFEST.txt

      - name: Generate Secure Config File
        id: config
        run: |
          cat > deploy_artifacts/config.js << 'EOF'
          /**
           * Configuration for Fidelis Application
           * Auto-generated at deployment time
           * @type {Object}
           */
          (function(window) {
            'use strict';
            
            // Validate configuration object before assignment
            const config = {
              SUPABASE_URL: '${{ secrets.SUPABASE_URL }}',
              SUPABASE_KEY: '${{ secrets.SUPABASE_KEY }}',
              ADMIN_EMAIL: '${{ secrets.ADMIN_EMAIL }}',
              ADMIN_HASH: '${{ secrets.ADMIN_HASH }}',
              ADMIN_SALT: '${{ secrets.ADMIN_SALT }}',
              ENV: 'production',
              BUILD_TIME: '$(date -u +'%Y-%m-%dT%H:%M:%SZ')',
              BUILD_HASH: '${{ github.sha }}'
            };
            
            // Freeze configuration to prevent runtime modifications
            if (Object.freeze) {
              Object.freeze(config);
            }
            
            window.FIDELIS_CONFIG = config;
            
            // Validate critical config values exist
            if (!config.SUPABASE_URL || !config.SUPABASE_KEY) {
              console.error('[FIDELIS] Critical configuration missing');
              throw new Error('Configuration initialization failed');
            }
          })(window);
          EOF
          
          # Verify config.js was created
          if [ ! -f deploy_artifacts/config.js ]; then
            echo "::error::Failed to create config.js"
            exit 1
          fi
          echo "✅ config.js created securely"

      - name: Copy HTML File
        run: |
          cp index.html deploy_artifacts/index.html
          if [ ! -f deploy_artifacts/index.html ]; then
            echo "::error::Failed to copy index.html to artifacts"
            exit 1
          fi
          echo "✅ index.html copied to artifacts"

      - name: Validate HTML Structure
        run: |
          # Basic HTML validation (requires html5validator or similar)
          if command -v html5validator &> /dev/null; then
            html5validator --root deploy_artifacts/ || echo "⚠️  HTML validation warnings found"
          else
            echo "⚠️  html5validator not available, skipping HTML validation"
          fi

      - name: Security Scan - Check for Secrets in Files
        run: |
          set +e
          
          # Scan for common secret patterns (basic check)
          grep -r "password\|secret\|api_key\|private_key" deploy_artifacts/ && \
            echo "::warning::Possible hardcoded secrets detected" || echo "✅ No obvious hardcoded secrets"
          
          # Check for AWS/GCP credentials patterns
          grep -r "AKIA\|AIza" deploy_artifacts/ && \
            echo "::error::AWS/GCP credentials pattern detected" && exit 1 || echo "✅ No credential patterns detected"
          
          set -e

      - name: Generate Artifact Hash
        id: hash
        run: |
          HASH=$(find deploy_artifacts -type f -exec sha256sum {} \; | sha256sum | cut -d' ' -f1)
          echo "sha=$HASH" >> $GITHUB_OUTPUT
          echo "Artifact Hash: $HASH" >> deploy_artifacts/DEPLOYMENT_MANIFEST.txt
          echo "✅ Artifact integrity hash generated"

      - name: List Artifact Contents
        run: |
          echo "=== Deployment Artifacts ===" >> deploy_artifacts/DEPLOYMENT_MANIFEST.txt
          find deploy_artifacts -type f -exec ls -lh {} \; >> deploy_artifacts/DEPLOYMENT_MANIFEST.txt
          cat deploy_artifacts/DEPLOYMENT_MANIFEST.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.run_number }}
          path: deploy_artifacts/
          retention-days: 30
          if-no-files-found: error
          compression-level: 9

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-${{ github.run_number }}
          path: ./deploy_dir

      - name: Verify Deployment Files
        run: |
          set -e
          
          if [ ! -f deploy_dir/index.html ]; then
            echo "::error::index.html not found in downloaded artifacts"
            exit 1
          fi
          
          if [ ! -f deploy_dir/config.js ]; then
            echo "::error::config.js not found in downloaded artifacts"
            exit 1
          fi
          
          echo "✅ All required deployment files verified"
          ls -la deploy_dir/

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy_dir
          retention-days: 30

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 10
          reporting_interval: 5000

      - name: Verify Deployment
        run: |
          echo "✅ Deployment completed successfully"
          echo "🔗 Site URL: ${{ steps.deployment.outputs.page_url }}"
          echo "📅 Deployed at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "📦 Build: ${{ github.sha }}"
          echo "🎯 Ref: ${{ github.ref }}"

  post-deploy:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - name: Check Deployment Health
        run: |
          echo "✅ Deployment pipeline completed successfully"
          echo "🔍 Verify your site at: https://${{ github.repository_owner }}.github.io"

      - name: Cleanup Old Artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            for (const artifact of artifacts.data.artifacts) {
              if (artifact.name.startsWith('deployment-')) {
                const createdDate = new Date(artifact.created_at);
                const now = new Date();
                const daysDiff = (now - createdDate) / (1000 * 60 * 60 * 24);
                
                if (daysDiff > 30) {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });
                  console.log(`Deleted artifact: ${artifact.name}`);
                }
              }
            }

  notify-failure:
    name: Notification on Failure
    runs-on: ubuntu-latest
    needs: [validate, build, deploy]
    if: failure()
    steps:
      - name: Log Failure Details
        run: |
          echo "::error::Deployment pipeline failed"
          echo "Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
